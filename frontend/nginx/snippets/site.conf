# O site em si (Angular + /api), igual nos dois modos. Incluído no server de cada modelo, que define
# $proto_original ("https" quando o Nginx tem o certificado; o que o proxy da frente informar, no outro modo).

# Foto da capa enviada pelo celular (o backend aceita até 10 MB)
client_max_body_size 12m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/csv;
gzip_min_length 1024;

root /usr/share/nginx/html;

location /api/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    # Substitui (não acrescenta): o limite de tentativas por IP do site não pode ser enganado.
    # Atrás de outro proxy, o real_ip do modelo http já trocou $remote_addr pelo IP do cidadão.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_original;
    proxy_read_timeout 60s;
    include /etc/nginx/snippets/cabecalhos.conf;
}

# Arquivos do build têm hash no nome: podem ficar em cache por um ano
location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/cabecalhos.conf;
}

# Rotas do Angular (/livro/12, /painel/acervo...) caem no index.html, que nunca fica em cache
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/cabecalhos.conf;
}
