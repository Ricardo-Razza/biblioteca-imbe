spring:
  application:
    name: biblioteca
  config:
    # Em desenvolvimento, lê o .env da raiz do repositório. Variáveis de ambiente reais têm prioridade.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biblioteca}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

biblioteca:
  isbn:
    # Timeout de conexão e de leitura por fonte
    timeout: 4s
    brasilapi:
      url: https://brasilapi.com.br

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
