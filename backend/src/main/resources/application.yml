spring:
  application:
    name: biblioteca
  config:
    # Em desenvolvimento, lê o .env da raiz do repositório. Variáveis de ambiente reais têm prioridade.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biblioteca}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        # Carrega autores e assuntos das obras de uma página em poucas consultas (evita N+1)
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      # Foto de celular da capa; o backend reduz para no máximo 800 px
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

biblioteca:
  isbn:
    # Timeout de conexão e de leitura por fonte
    timeout: 4s
    # Inclui "não encontrado"; resultado com fonte fora do ar não entra no cache
    cache-ttl: 24h
    brasilapi:
      url: https://brasilapi.com.br
    google-books:
      url: https://www.googleapis.com
      chave: ${GOOGLE_BOOKS_API_KEY:}
    open-library:
      url: https://openlibrary.org
      capas-url: https://covers.openlibrary.org

  auth:
    jwt:
      # Pelo menos 32 caracteres. Sem ele a aplicação não sobe.
      segredo: ${JWT_SECRET:}
      validade: 8h
    ad:
      # API de login da Prefeitura. Vazia: só usuários LOCAL entram.
      url: ${AD_AUTH_URL:}
      token: ${AD_AUTH_TOKEN:}
      timeout: 4s
    # Senhas erradas seguidas antes de travar o login, e por quanto tempo
    tentativas: 5
    bloqueio: 15m
    admin-inicial:
      # Só usado com o banco sem nenhum funcionário; a senha é provisória
      login: ${ADMIN_INICIAL_LOGIN:admin}
      senha: ${ADMIN_INICIAL_SENHA:}

  capas:
    diretorio: ${CAPAS_DIR:/dados/capas}
    lado-maximo: 800
    largura-miniatura: 200
    tamanho-maximo-download: 5MB
    timeout: 4s

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
