problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Este endereço não aceita o método {0}.

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Formato não suportado
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=O formato do conteúdo enviado não é aceito.

problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Formato não disponível
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=O formato de resposta pedido não está disponível.

