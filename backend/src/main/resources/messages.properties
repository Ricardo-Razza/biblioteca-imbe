problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Parâmetro obrigatório
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Informe o parâmetro {0}.

problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Dados inválidos
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Há parâmetros inválidos. Corrija e tente novamente.

problemDetail.title.org.springframework.web.multipart.MaxUploadSizeExceededException=Arquivo grande demais
problemDetail.org.springframework.web.multipart.MaxUploadSizeExceededException=O arquivo enviado passa do tamanho permitido.
